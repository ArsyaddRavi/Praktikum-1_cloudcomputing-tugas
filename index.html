<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Web Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(139,92,246,0.35), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(20,184,166,0.30), transparent 40%);
            color: #e2e8f0;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 460px;
            background: rgba(30,41,59,0.75);
            border: 1px solid rgba(148,163,184,0.2);
            border-radius: 20px;
            padding: 36px 32px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #fde68a;
            background: rgba(20,184,166,0.12);
            padding: 6px 12px;
            border-radius: 999px;
        }
        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #facc15;
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.5); }
        }
        h1 { font-size: 28px; margin: 18px 0 8px; color: #fff; }
        .sub { color: #94a3b8; line-height: 1.5; margin-bottom: 24px; }
        .steps {
            background: rgba(15,23,42,0.6);
            border-radius: 12px;
            padding: 14px 18px 14px 36px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.8;
            color: #cbd5e1;
        }
        .info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .box {
            background: rgba(250,204,21,0.12);
            border-radius: 12px;
            padding: 14px;
        }
        .box span { display: block; font-size: 12px; color: #64748b; margin-bottom: 4px; }
        .box strong { font-size: 15px; color: #f1f5f9; }
        .box.wide { grid-column: span 2; }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #f59e0b, #ec4899);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform .15s, opacity .15s;
        }
        .btn:hover { transform: translateY(-2px); opacity: .92; }
        #msg {
            margin-top: 14px;
            text-align: center;
            font-size: 14px;
            color: #fde68a;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <main class="card">
       <div class="status"><span class="dot"></span> Versi 2 - Hasil Modifikasi</div>da
       <h1>Continuous Deployment</h1>
        <p class="sub">Arsyad Raviandra Bahri <br>
            102042400013<br>
         </p>
        <ol class="steps">
    <li>Edit file index.html di GitHub</li>
    <li>Commit perubahan</li>
    <li>Vercel mendeteksi perubahan</li>
    <li>Website otomatis diperbarui</li>
</ol>

        <div class="info">
            <div class="box"><span>Tanggal</span><strong id="date"></strong></div>
            <div class="box"><span>Jam</span><strong id="clock"></strong></div>
            <div class="box wide"><span>Alamat halaman</span><strong id="url"></strong></div>
        </div>

        <button class="btn" onclick="sapa()">Tes Deployment</button>
        <p id="msg"></p>
    </main>

    <script>
        function tick() {
            const now = new Date();
            document.getElementById("date").textContent =
                now.toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
            document.getElementById("clock").textContent = now.toLocaleTimeString("id-ID");
        }
        setInterval(tick, 1000);
        tick();

        document.getElementById("url").textContent = window.location.host || "localhost";

        function sapa() {
            document.getElementById("msg").textContent = "Berhasil! Perubahan dari GitHub sudah live.";
        }
    </script>
</body>
</html>
